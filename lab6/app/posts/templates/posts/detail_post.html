{% extends 'base.html' %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
<div class="card shadow-sm p-4">
    <h2>{{ post.title }}</h2>
    <p class="text-muted">Категорія: {{ post.category }} | Автор: {{ post.author }} | Дата: {{ post.posted.strftime('%Y-%m-%d %H:%M') }}</p>
    <hr>
    <p>{{ post.content }}</p>
    <hr>
    <div class="mt-3">
        <a href="{{ url_for('posts.update_post', id=post.id) }}" class="btn btn-warning">Редагувати</a>
        <a href="{{ url_for('posts.delete_post', id=post.id) }}" class="btn btn-danger">Видалити</a>
        <a href="{{ url_for('posts.all_posts') }}" class="btn btn-secondary">Назад</a>
    </div>
</div>
{% endblock %}
