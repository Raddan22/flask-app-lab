{% extends 'base.html' %}
{% block title %}Всі пости{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('posts.static', filename='css/posts.css') }}">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Всі пости</h2>
    <a href="{{ url_for('posts.create_post') }}" class="btn btn-primary">Додати пост</a>
</div>
<div class="row">
    {% for post in posts %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            <img src="{{ url_for('posts.static', filename='img/default.jpg') }}" class="card-img-top" alt="post default">
            <div class="card-body">
                <h5 class="card-title">{{ post.title }}</h5>
                <p class="card-text text-muted small">{{ post.category }} | {{ post.posted.strftime('%Y-%m-%d') }}</p>
                <p class="card-text">{{ post.content[:100] }}...</p>
            </div>
            <div class="card-footer bg-transparent">
                <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-sm btn-outline-primary">Детальніше</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
