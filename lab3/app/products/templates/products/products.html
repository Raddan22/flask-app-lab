{% extends 'base.html' %}
{% block title %}Список товарів{% endblock %}

{% block content %}
<h2>Список товарів</h2>
<ul>
    {% for product in products %}
        <li style="margin-bottom: 10px;">
            <a href="{{ url_for('products.detail_product', id=product.id) }}">
                <strong>{{ product.name }}</strong>
            </a> - ${{ product.price }}
        </li>
    {% endfor %}
</ul>
{% endblock %}
